<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollspel – USB-AI</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f4f1ea;
    color: #222;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 0.6rem 1rem;
    background: #2f3b2f;
    color: #f4f1ea;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  select { font: inherit; padding: 0.3rem 0.5rem; max-width: 60vw; }
  #status { font-size: 0.8rem; opacity: 0.8; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .meddelande {
    max-width: 80ch;
    padding: 0.6rem 0.9rem;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.45;
  }
  .spelare { align-self: flex-end; background: #d7e4d2; }
  .berattare { align-self: flex-start; background: #ffffff; border: 1px solid #d8d2c2; }
  #form {
    display: flex;
    gap: 0.5rem;
    padding: 0.7rem;
    border-top: 1px solid #d8d2c2;
    background: #efe9dc;
  }
  textarea {
    flex: 1;
    font: inherit;
    padding: 0.5rem;
    resize: vertical;
    min-height: 2.6rem;
  }
  button {
    font: inherit;
    padding: 0.5rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: #2f3b2f;
    color: #f4f1ea;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
</style>
</head>
<body>
<header>
  <h1>Rollspel</h1>
  <label>Scenario
    <select id="scenarieval"></select>
  </label>
  <span id="status"></span>
</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" placeholder="Vad gör du?" autofocus></textarea>
  <button id="skicka" type="submit">Skicka</button>
</form>
<script src="scenarier.js"></script>
<script>
  'use strict';

  var scenarier = window.SCENARIER || [];
  var val = document.getElementById('scenarieval');
  var chat = document.getElementById('chat');
  var status = document.getElementById('status');
  var input = document.getElementById('input');
  var skicka = document.getElementById('skicka');
  var historik = [];

  scenarier.forEach(function (s) {
    var alt = document.createElement('option');
    alt.value = s.id;
    alt.textContent = s.titel;
    val.appendChild(alt);
  });

  function visa(text, roll) {
    var ruta = document.createElement('div');
    ruta.className = 'meddelande ' + roll;
    ruta.textContent = text;
    chat.appendChild(ruta);
    chat.scrollTop = chat.scrollHeight;
  }

  function startaScenario() {
    var s = scenarier.find(function (x) { return x.id === val.value; });
    if (!s) return;
    chat.textContent = '';
    historik = [];
    visa(s.beskrivning, 'berattare');
    visa(s.uppstart, 'berattare');
    window.aktivtScenario = s;
    status.textContent = s.titel;
  }

  skicka.disabled = true;
  fetch('/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'usb-ai',
      messages: [{ role: 'user', content: 'Svara med ett ord: klar.' }],
      max_tokens: 8
    })
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    skicka.disabled = false;
    status.textContent = 'Ansluten';
    startaScenario();
  }).catch(function () {
    status.textContent = 'Ingen kontakt med modellen';
    visa('Kunde inte nå modellen på 127.0.0.1:8080. Kontrollera att start.bat körs.', 'berattare');
  });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || skicka.disabled) return;
    input.value = '';
    visa(text, 'spelare');
    historik.push({ role: 'user', content: text });
    skicka.disabled = true;

    var systemText = window.aktivtScenario.systemPrompt +
      '\n\nSpelets uppstart: ' + window.aktivtScenario.uppstart;
    var meddelanden = [{ role: 'system', content: systemText }].concat(historik);
    fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'usb-ai',
        messages: meddelanden,
        temperature: 0.8,
        max_tokens: 512
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (svar) {
      var innehall = svar.choices && svar.choices[0] && svar.choices[0].message
        ? svar.choices[0].message.content : '(tomt svar)';
      visa(innehall, 'berattare');
      historik.push({ role: 'assistant', content: innehall });
    }).catch(function () {
      visa('Modellen svarade inte. Försök igen.', 'berattare');
    }).finally(function () {
      skicka.disabled = false;
      input.focus();
    });
  });

  val.addEventListener('change', startaScenario);
</script>
</body>
</html>
